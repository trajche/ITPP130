name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # Debian trixie matches current Raspberry Pi OS.
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev \
            libcups2-dev libcupsimage2-dev cups-ppdc \
            cups cups-filters ghostscript

      - name: Build
        run: make

      - name: Test filter output
        run: make test

      - name: Validate PPD
        run: |
          make install
          cupstestppd -W translations -W sizes -I filename /usr/share/ppd/munbyn/munbyn-itpp130.ppd

      - name: Build .deb
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir dist
          mv ../*.deb dist/
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.deb \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
